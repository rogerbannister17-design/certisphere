services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: certisphere
      POSTGRES_USER: certisphere
      POSTGRES_PASSWORD: certisphere_local_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certisphere -d certisphere"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
