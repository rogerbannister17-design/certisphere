packages:
  - "apps/*/*"
  - "apps/api/*"
  - "packages/*"
  - "services/*"

overrides:
  multer: "^2.2.0"

onlyBuiltDependencies:
  - "argon2"
  - "@prisma/client"
  - "@prisma/engines"
  - "@scarf/scarf"
  - "esbuild"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
